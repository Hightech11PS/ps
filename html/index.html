<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIGH TECH PS - Maintenance & Jailbreak</title>
    <style>
        :root {
            --bg-color: #05070f;
            --container-bg: #0b1122;
            --accent-color: #0070d2; 
            --accent-glow: rgba(0, 112, 210, 0.3);
            --text-main: #f0f4f8;
            --text-muted: #8a99ad;
            --status-ready: #00e676;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* حاوية الصورة الأساسية لعرضها كاملة وبأعلى جودة */
        .hero-banner {
            width: 100%;
            max-width: 1000px; /* العرض الأقصى لضمان عدم تمددها بشكل مشوه */
            margin-top: 20px;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .hero-banner img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-glow);
            display: block;
        }

        /* لوحة التحكم والأزرار أسفل الصورة */
        .container {
            background-color: var(--container-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            margin: 25px 0;
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 1px;
            margin: 0 0 5px 0;
            color: #ffffff;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .exploit-title {
            background: linear-gradient(45deg, #0070d2, #00dfa2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .menu-section {
            margin: 15px 0;
            text-align: left;
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .menu-item:hover {
            background: rgba(0, 112, 210, 0.1);
            border-color: var(--accent-color);
        }

        .btn-action {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 7px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background-color: #005cb3;
        }

        .item-label {
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .item-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: block;
        }

        .console-box {
            background-color: #020408;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            text-align: left;
            font-size: 0.85rem;
            color: #a2b1c6;
            max-height: 120px;
            overflow-y: auto;
        }

        .console-line {
            margin: 4px 0;
        }

        .prefix {
            color: var(--accent-color);
        }

        .status-ready {
            color: var(--status-ready);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- الجزء العلوي: يعرض صورتك كاملة وبشكل بارز -->
    <div class="hero-banner">
        <img src="background.png" alt="HIGH TECH STORE">
    </div>

    <!-- الجزء السفلي: لوحة تحكم ثغرة الـ Jailbreak -->
    <div class="container">
        <h1>HIGH TECH PS</h1>
        <div class="subtitle">PlayStation Maintenance & Software Solutions</div>
        
        <div class="exploit-title">CSSFontFace UAF Exploit</div>

        <div class="menu-section">
            <div class="menu-item">
                <div>
                    <span class="item-label">NetCtrl</span>
                    <span class="item-sub">Network controller service</span>
                </div>
                <button class="btn-action" onclick="logAction('netctrl')">Run netctrl</button>
            </div>

            <div class="menu-item">
                <div>
                    <span class="item-label">Lapse</span>
                    <span class="item-sub">System lapse module</span>
                </div>
                <button class="btn-action" onclick="logAction('lapse')">Run lapse</button>
            </div>

            <div class="menu-item">
                <div>
                    <span class="item-label">Auto Jailbreak</span>
                    <span class="item-sub">Automated Jeilbrek execution</span>
                </div>
                <button class="btn-action" onclick="logAction('jailbreak')">Trigger</button>
            </div>
        </div>

        <div class="console-box" id="consoleBox">
            <div class="console-line"><span class="prefix">[-]</span> Core initialized successfully.</div>
            <div class="console-line"><span class="prefix">[-]</span> Ready. Awaiting execution...</div>
        </div>
    </div>

    <script>
        function logAction(type) {
            const consoleBox = document.getElementById('consoleBox');
            let text = '';
            
            if(type === 'netctrl') {
                text = `<div class="console-line"><span class="prefix">[-]</span> Running netctrl...</div>
                        <div class="console-line"><span class="prefix">[-]</span> netctrl executed.</div>`;
            } else if(type === 'lapse') {
                text = `<div class="console-line"><span class="prefix">[-]</span> Injecting lapse payload...</div>
                        <div class="console-line"><span class="prefix">[-]</span> lapse module loaded.</div>`;
            } else if(type === 'jailbreak') {
                text = `<div class="console-line"><span class="prefix">[-]</span> <span class="status-ready">Exploiting CSSFontFace UAF...</span></div>
                        <div class="console-line"><span class="prefix">[-]</span> Jailbreak environment ready!</div>`;
            }
            
            consoleBox.innerHTML += text;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }
    </script>
</body>
</html>
